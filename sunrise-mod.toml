id = "ae2"
name = "Applied Energistics 2"
version = "15.4.14"
description = "A matter-energy storage network: cables, drives and cells, terminals, buses, autocrafting, P2P tunnels and spatial storage. A port of Applied Energistics 2 (TeamAppliedEnergistics, LGPL-3.0) to Sunrise's mod API."
authors = ["Sunrise port: Joeypc6", "TeamAppliedEnergistics"]
api = "0.2"
side = "both"
capabilities = ["registries"]
license = "LGPL-3.0-or-later AND CC-BY-NC-SA-3.0 AND CC0-1.0 AND CC-BY-4.0"
license_url = "https://github.com/Joeypc6/AE2-Sunrise/blob/main/NOTICE"
credits = "Sunrise port by Joeypc6, based on Applied Energistics 2 by TeamAppliedEnergistics (AlgorithmX2 et al.; textures and models by Ridanisaurus Rid and AlgorithmX2 et al.)."
homepage = "https://github.com/Joeypc6/AE2-Sunrise"
issues = "https://github.com/Joeypc6/AE2-Sunrise/issues"

[native]
game = "26.3"
# Pinned to Sunrise Dev 2026-11-24 (f8aa80e).
sunrise = "f8aa80e4c40cf1a5d30e85d13937f3fcf06d8237"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[dependencies]
# The W guide's pages are files (assets/ae2/ae2guide) GuideME reads; AE2's JEI categories; AE2's Jade lines.
guideme = { version = "^0.1", optional = true }
jei = { version = "^0.5.5", optional = true }
jade = { version = "^26", optional = true }
# The shared machine-time capability (machine_work::MACHINE_WORK) the crafting ETA asks a pattern's machine first (src/eta.rs).
machine_work = { version = "^0.1", optional = true }
